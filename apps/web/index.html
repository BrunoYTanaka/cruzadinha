<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Cruzadinha</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica a escolha de tema antes da primeira pintura, para não piscar branco. Lê as
      // configurações (feature 021) e, sem elas, a chave antiga.
      try {
        var t = null
        try {
          var s = JSON.parse(localStorage.getItem('cruzadinha:settings'))
          if (s && s.v === 1 && s.settings) t = s.settings.theme
        } catch (e) {}
        if (t === null || t === undefined) t = localStorage.getItem('cruzadinha:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
