# Blueprint da API no Render (feature 012). Ver docs/deploy.md.
#
# - O deploy é feito pelo workflow .github/workflows/deploy.yml, pelo deploy hook, só para
#   versões lançadas; por isso o auto-deploy fica desligado.
# - Os segredos (DATABASE_URL, PROXY_SECRET) são preenchidos no painel do Render, nunca aqui.
# - Mudanças neste arquivo valem pela sincronização do Blueprint, não pela versão da API.
services:
  - type: web
    name: cruzadinha-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: TRUST_PROXY_HOPS
        value: '0'
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: PROXY_SECRET
        sync: false
      # Cadastro aberto (feature 013). Definida só no painel do Render; ausente vale `false`
      # (cadastro fechado). Mudar no painel e reiniciar abre ou fecha o cadastro sem nova versão.
      # Sem `value` aqui: um valor no Blueprint voltaria a cada sincronização e desfaria o painel.
      - key: REGISTRATION_ENABLED
        sync: false
      # E-mail de confirmação e de recuperação de senha (feature 035). Só no painel do Render; sem
      # elas as rotas que enviam e-mail respondem `email-unavailable`. Ver docs/deploy.md.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
