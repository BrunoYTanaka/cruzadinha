name: Coleta de puzzles

# 00:01 e 08:00 em Brasília (UTC-3, sem horário de verão). A coleta é idempotente, então uma
# execução repetida ou atrasada não causa dano. Detalhes em specs/006-coleta-puzzles.
on:
  schedule:
    - cron: '1 3 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # Só um booleano: o valor do segredo não sai deste passo. Sem o segredo (antes da
      # implantação), o agendamento é ignorado e o disparo manual falha com erro.
      - id: guard
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_DATABASE_URL" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::segredo DATABASE_URL não cadastrado"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::coleta ignorada: segredo DATABASE_URL não cadastrado"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.guard.outputs.enabled == 'true'
        run: npm ci
      - if: steps.guard.outputs.enabled == 'true'
        run: npm run build -w @cruzadinha/api
      # Não migra: a API aplica as migrações ao subir. Depois de uma migração nova, a coleta
      # falha até a API ser publicada; a execução seguinte se recupera.
      - if: steps.guard.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECT_HISTORY_DAYS: ${{ vars.COLLECT_HISTORY_DAYS }}
        run: |
          set -o pipefail
          node apps/api/dist/cli.mjs puzzles collect 2>&1 | tee collect.log
      # Limpeza de pendências de cadastro e tokens de recuperação vencidos (feature 035). Roda mesmo
      # se a coleta falhar, porque não depende dela.
      - if: always() && steps.guard.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node apps/api/dist/cli.mjs auth cleanup
      # Uma issue por fonte que falhou (feature 037). Só as linhas "Falhou em" acusam uma fonte:
      # limite de uso, banco fora do ar e segredo ausente não abrem issue. O corpo leva apenas as
      # linhas da fonte, nunca a saída inteira.
      - if: failure() && steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f collect.log ] || exit 0
          gh label create fonte-quebrada --color B60205 --description "Fonte de puzzles parou de coletar" --force
          grep -oP '^\[\K[^\]]+(?=\] Falhou em)' collect.log | sort -u | while IFS= read -r fonte; do
            title="[Fonte] $fonte parou de coletar"
            open=$(gh issue list --label fonte-quebrada --state open --json title \
              --jq --arg t "$title" '[.[] | select(.title == $t)] | length')
            if [ "$open" != "0" ]; then
              echo "issue já aberta para $fonte"
              continue
            fi
            {
              echo "A coleta agendada falhou nesta fonte."
              echo
              echo '```'
              grep -F "[$fonte] " collect.log | grep -E 'Falhou em|Erro em' | head -n 20
              echo '```'
              echo
              echo "Execução: $RUN_URL"
            } > body.md
            gh issue create --label fonte-quebrada --title "$title" --body-file body.md
          done

  # Em repositório público, o GitHub desativa agendamentos depois de 60 dias sem atividade.
  # Reativar o workflow pela API todo dia 1 (na primeira execução do dia) renova esse prazo sem
  # commits vazios. Não depende do segredo do banco (feature 012, research R8).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reativar o agendamento no dia 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/$REPO/actions/workflows/collect.yml/enable"
            echo "agendamento reativado"
          else
            echo "nada a fazer hoje"
          fi
